services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped

  headroom:
    build: ./services/headroom
    container_name: headroom-proxy
    ports:
      - "8787:8787"
    restart: unless-stopped

  router:
    build: ./services/router
    container_name: quota-router
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "${PORT_ROUTER:-8088}:8000"
    environment:
      - HOME=/home/appuser
      - PYTHONUNBUFFERED=1
      - WORKSPACE_DIR=/workspace
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:1.5b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-180}
      - HEADROOM_PROXY=http://headroom:8787
      - AGY_MODEL=${AGY_MODEL:-claude-3-5-sonnet}
      - AGY_TIMEOUT=${AGY_TIMEOUT:-180}
      - ANTHROPIC_BASE_URL=http://headroom:8787
      - OPENAI_BASE_URL=http://headroom:8787/v1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PYTHONPATH=/app/src
    volumes:
      - ${AGY_BIN_PATH:-${HOST_HOME}/.local/bin/agy}:/usr/local/bin/agy:ro
      - ${HOST_LOCAL_PATH:-${HOST_HOME}/.local}:/home/appuser/.local:ro
      - ${HOST_CONFIG_PATH:-${HOST_HOME}/.config}:/home/appuser/.config:ro
      - ${HOST_GCLOUD_PATH:-${HOST_HOME}/.config/gcloud}:/home/appuser/.config/gcloud:ro
      - ${HOST_GEMINI_PATH:-${HOST_HOME}/.gemini}:/home/appuser/.gemini:rw
      - ${WORKSPACE_PATH:-${HOST_HOME}/development}:/workspace:rw
      - ./.antigravity:/app/.antigravity:ro
      - ./services/router/src:/app/src:rw
      - ./services/router/tests:/app/tests:rw
    working_dir: /app
    depends_on:
      - ollama
      - headroom
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://router:8000/v1
      - OPENAI_API_BASE_URLS=http://router:8000/v1;http://headroom:8787/v1
      - OPENAI_API_KEY=local-dev
      - OPENAI_API_KEYS=local-dev;local-dev
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      - router
    restart: unless-stopped

volumes:
  ollama_storage:
  webui_data:
